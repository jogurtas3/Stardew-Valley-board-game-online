<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kauliukas – pirma versija</title>
<style>
:root{color-scheme:light;font-family:Georgia,"Times New Roman",serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:#f3dfb3}.stardew-dice{--die-size:clamp(112px,32vw,174px);width:min(94vw,680px);color:#402716}.symbols{position:absolute;width:0;height:0;overflow:hidden}.card{overflow:hidden;padding:clamp(20px,5vw,38px);text-align:center;border:5px solid #7d4828;border-radius:22px;background:#f7e4ae;box-shadow:0 17px 45px rgb(61 35 18/28%),inset 0 0 0 3px #cf9656}.heading h1{margin:1px 0 17px;font-size:clamp(1.75rem,5vw,2.65rem);line-height:1;text-shadow:0 2px #fff1c8}.eyebrow{margin:0 0 7px;color:#7e512d;font:700 .76rem/1.2 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase}.table{position:relative;height:clamp(275px,53vw,350px);overflow:hidden;border:4px solid #60351e;border-radius:17px;background:linear-gradient(90deg,transparent 0 32%,rgb(66 29 10/25%) 32.5% 33%,transparent 33.5% 67%,rgb(66 29 10/24%) 67.5% 68%,transparent 68.5%),repeating-linear-gradient(0deg,rgb(255 255 255/4%) 0 2px,transparent 2px 7px),linear-gradient(145deg,#b66c35,#81421f 54%,#633017);box-shadow:inset 0 14px 25px rgb(255 218 151/13%),inset 0 -18px 30px rgb(46 17 5/25%);perspective:850px}.table:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 35%,transparent 0 28%,rgb(31 13 4/16%) 100%)}.scene{position:absolute;z-index:2;left:50%;top:45%;width:var(--die-size);height:var(--die-size);transform:translate(-50%,-50%);perspective:720px}.cube{position:relative;z-index:2;width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(-13deg) rotateY(24deg);transition:transform 1.05s cubic-bezier(.18,.68,.2,1.02);will-change:transform}.cube.rolling{animation:hop 1.05s ease-in-out}.face{--half:calc(var(--die-size)/2);position:absolute;inset:0;display:grid;place-items:center;border:3px solid #d8d8d2;border-radius:18%;background:radial-gradient(circle at 33% 25%,#fff 0 16%,#f7f7f4 47%,#d7d8d2 100%);box-shadow:inset -10px -12px 20px rgb(71 71 64/13%),inset 7px 8px 13px #fff;backface-visibility:hidden}.face svg{width:61%;height:61%;overflow:visible}.front{transform:rotateY(0) translateZ(var(--half))}.back{transform:rotateY(180deg) translateZ(var(--half))}.right{transform:rotateY(90deg) translateZ(var(--half))}.left{transform:rotateY(-90deg) translateZ(var(--half))}.top{transform:rotateX(90deg) translateZ(var(--half))}.bottom{transform:rotateX(-90deg) translateZ(var(--half))}.shadow{position:absolute;z-index:1;left:50%;bottom:-46%;width:130%;height:31%;border-radius:50%;background:rgb(27 11 4/46%);filter:blur(14px);transform:translateX(-50%);transition:transform .4s,opacity .4s}.rolling+.shadow{opacity:.42;transform:translateX(-50%) scale(.72)}.particles{position:absolute;z-index:4;inset:0;pointer-events:none}.particle{position:absolute;left:50%;top:46%;width:var(--s,10px);height:var(--s,10px);border-radius:var(--r,50%);background:var(--c,#fff);box-shadow:0 1px 2px rgb(0 0 0/20%);animation:burst 700ms ease-out forwards}.result{min-height:1.6em;margin:19px 0 13px;font:700 clamp(1rem,3.5vw,1.2rem)/1.35 system-ui,sans-serif}.button{min-width:175px;padding:13px 27px;border:3px solid #713b20;border-radius:10px;color:#fff8dc;background:linear-gradient(#5dad48,#347b35);box-shadow:0 5px 0 #235625,0 8px 14px rgb(41 25 13/24%),inset 0 2px #91d56d;font:800 1rem/1 system-ui,sans-serif;cursor:pointer}.button:disabled{cursor:wait;filter:saturate(.6)}@keyframes hop{0%,100%{margin-top:0}35%{margin-top:-44px}72%{margin-top:7px}}@keyframes burst{from{opacity:1;transform:translate(-50%,-50%) scale(.4)}to{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.15) rotate(var(--rot))}}@media(prefers-reduced-motion:reduce){.cube{transition-duration:.01ms}.cube.rolling{animation:none}.particle{animation-duration:.01ms}}
</style>
</head>
<body>
<main class="stardew-dice">
<svg class="symbols" aria-hidden="true"><defs>
<symbol id="heart" viewBox="0 0 100 100"><path d="M50 83 18 53C-3 33 11 9 31 15c8 2 14 8 19 15 5-7 11-13 19-15 20-6 34 18 13 38Z" fill="url(#hf)" stroke="#4d1814" stroke-width="7" stroke-linejoin="round"/><path d="M28 27c7-5 14-3 19 3" fill="none" stroke="#ff8b92" stroke-width="7" stroke-linecap="round" opacity=".8"/></symbol>
<symbol id="junimo" viewBox="0 0 100 100"><path d="M50 24c-4-11 5-18 2-25 12 5 14 16 8 25" fill="none" stroke="#185a32" stroke-width="7" stroke-linecap="round"/><path d="M22 50c0-19 11-30 28-30s28 11 28 30v19c0 15-11 24-28 24S22 84 22 69Z" fill="url(#jf)" stroke="#3c2418" stroke-width="6"/><path d="M22 47 11 33M78 47l11-14M37 91l-2 8M63 91l2 8" fill="none" stroke="#3c2418" stroke-width="6" stroke-linecap="round"/><circle cx="39" cy="59" r="4" fill="#163d2a"/><circle cx="61" cy="59" r="4" fill="#163d2a"/><ellipse cx="33" cy="72" rx="6" ry="4" fill="#f29ab4"/><ellipse cx="67" cy="72" rx="6" ry="4" fill="#f29ab4"/></symbol>
<symbol id="stardrop" viewBox="0 0 100 100"><path d="M49 27C35 13 20 19 15 31c14 2 25 2 34-4ZM51 27c14-14 29-8 34 4-14 2-25 2-34-4Z" fill="#3cbf58" stroke="#4a281b" stroke-width="5"/><path d="M50 31c-5 0-8 6-8 13L20 50c-5 2-6 8-2 12l15 13-2 20c0 6 6 9 11 6l8-5 8 5c5 3 11 0 11-6l-2-20 15-13c4-4 3-10-2-12l-22-6c0-7-3-13-8-13Z" fill="url(#sf)" stroke="#4a281b" stroke-width="6"/><circle cx="50" cy="67" r="9" fill="#f5e7ca" stroke="#4a281b" stroke-width="5"/></symbol>
<linearGradient id="hf" x2="0" y2="1"><stop stop-color="#ff3850"/><stop offset="1" stop-color="#d90816"/></linearGradient><linearGradient id="jf" x2="1" y2="1"><stop stop-color="#91e43f"/><stop offset="1" stop-color="#35a932"/></linearGradient><linearGradient id="sf" x2="1" y2="1"><stop stop-color="#c45de8"/><stop offset="1" stop-color="#4939bd"/></linearGradient>
</defs></svg>
<section class="card"><div class="heading"><p class="eyebrow">Stardew Valley</p><h1>Ridenk kauliuką</h1></div><div class="table"><div class="particles"></div><div class="scene"><div class="cube"><div class="face front"><svg><use href="#heart"/></svg></div><div class="face back"><svg><use href="#heart"/></svg></div><div class="face right"><svg><use href="#heart"/></svg></div><div class="face left"><svg><use href="#junimo"/></svg></div><div class="face top"><svg><use href="#junimo"/></svg></div><div class="face bottom"><svg><use href="#stardrop"/></svg></div></div><div class="shadow"></div></div></div><p class="result" aria-live="polite">Paspausk mygtuką ir išridenk simbolį</p><button class="button" type="button">Ridenti</button></section>
</main>
<script>
(()=>{const results=[['Širdis','heart',0,0],['Širdis','heart',0,180],['Širdis','heart',0,-90],['Junimo','junimo',0,90],['Junimo','junimo',-90,0],['Stardrop','stardrop',90,0]],colors={heart:['#ff3045','#ff7d8a','#ffd0d4'],junimo:['#4fbd3b','#9be34f','#245e32'],stardrop:['#8148d8','#d07be8','#f3d36a']},cube=document.querySelector('.cube'),button=document.querySelector('.button'),text=document.querySelector('.result'),layer=document.querySelector('.particles');let count=0,busy=false;button.onclick=()=>{if(busy)return;busy=true;count++;const r=results[Math.floor(Math.random()*6)],turn=count*1080;button.disabled=true;button.textContent='Ridenama…';text.textContent='Kauliukas rieda…';cube.classList.remove('rolling');void cube.offsetWidth;cube.classList.add('rolling');cube.style.transform=`rotateX(${turn+r[2]}deg) rotateY(${turn+r[3]}deg)`;setTimeout(()=>{cube.classList.remove('rolling');text.textContent=`Išridenai: ${r[0]}`;button.textContent='Ridenti dar kartą';button.disabled=false;busy=false;layer.replaceChildren();for(let i=0;i<16;i++){const p=document.createElement('i'),a=Math.PI*2*i/16,d=75+Math.random()*100;p.className='particle';p.style.setProperty('--c',colors[r[1]][i%3]);p.style.setProperty('--s',`${6+Math.random()*9}px`);p.style.setProperty('--x',`${Math.cos(a)*d}px`);p.style.setProperty('--y',`${Math.sin(a)*d}px`);p.style.setProperty('--rot',`${Math.random()*540}deg`);layer.append(p)}setTimeout(()=>layer.replaceChildren(),760)},1080)}})();
</script>
</body>
</html>
