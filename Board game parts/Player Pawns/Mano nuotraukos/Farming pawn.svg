<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
  <title id="title">Farming žaidėjo žymeklis</title>
  <desc id="desc">Geltonas žaidėjo žymeklis, perpieštas pagal originalios figūrėlės JPG nuotrauką.</desc>
  <defs>
    <linearGradient id="plastic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b9000"/>
      <stop offset="0.22" stop-color="#e2d800"/>
      <stop offset="0.46" stop-color="#fff94d"/>
      <stop offset="0.72" stop-color="#f4eb00"/>
      <stop offset="1" stop-color="#7f7600"/>
    </linearGradient>
    <linearGradient id="plasticSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4eb00"/>
      <stop offset="0.55" stop-color="#b9aa00"/>
      <stop offset="1" stop-color="#665f00"/>
    </linearGradient>
    <radialGradient id="roundLight" cx="36%" cy="22%" r="78%">
      <stop offset="0" stop-color="#fff982" stop-opacity="0.72"/>
      <stop offset="0.48" stop-color="#f4eb00" stop-opacity="0"/>
      <stop offset="1" stop-color="#665f00" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="objectShadow" x="-30%" y="-20%" width="170%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="11" flood-color="#111827" flood-opacity="0.28"/>
    </filter>
    <filter id="groundBlur" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <ellipse cx="300" cy="724" rx="200" ry="22" fill="#111827" opacity="0.2" filter="url(#groundBlur)"/>

  <g filter="url(#objectShadow)">
    <!-- Apatinis apvalus diskas -->
    <ellipse cx="300" cy="650" rx="225" ry="47" fill="url(#plastic)"/>
    <path d="M75 650
             C75 675 176 693 300 693
             C424 693 525 675 525 650
             L525 690
             C525 714 424 731 300 731
             C176 731 75 714 75 690 Z" fill="url(#plasticSide)"/>
    <path d="M88 658 C141 678 221 686 300 686 C379 686 459 678 512 658" fill="none" stroke="#fff982" stroke-opacity="0.18" stroke-width="7" stroke-linecap="round"/>
    <path d="M75 690 C75 714 176 731 300 731 C424 731 525 714 525 690" fill="none" stroke="#665f00" stroke-opacity="0.42" stroke-width="5"/>

    <!-- Atrama ir įdubę žiedai iš JPG -->
    <!-- Visa viršutinė figūrėlės dalis nuleista ant pagrindo centro -->
    <g transform="translate(0 18)">
    <ellipse cx="300" cy="616" rx="105" ry="20" fill="url(#plastic)"/>
    <path d="M195 616
             C195 627 242 634 300 634
             C358 634 405 627 405 616
             L405 624
             C405 636 358 643 300 643
             C242 643 195 636 195 624 Z" fill="url(#plasticSide)"/>

    <path d="M186 540
             C214 526 250 520 300 520
             C350 520 386 526 414 540
             L407 572
             C400 588 389 600 374 610
             C335 620 265 620 226 610
             C211 600 200 588 193 572 Z" fill="url(#plasticSide)"/>
    <ellipse cx="300" cy="542" rx="114" ry="29" fill="url(#plastic)"/>
    <path d="M198 549 C238 561 362 561 402 549" fill="none" stroke="#fff982" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round"/>

    <!-- Vientisas galvos, kaklo ir platėjančio kūno kontūras -->
    <path d="M300 50
             C254 50 222 84 223 130
             C224 169 240 196 257 210
             C267 223 268 241 265 266
             C261 300 249 328 234 360
             C214 403 196 457 188 511
             C185 529 190 540 204 547
             C255 566 345 566 396 547
             C410 540 415 529 412 511
             C404 457 386 403 366 360
             C351 328 339 300 335 266
             C332 241 333 223 343 210
             C360 196 376 169 377 130
             C378 84 346 50 300 50 Z" fill="url(#plastic)"/>
    <path d="M300 50
             C254 50 222 84 223 130
             C224 169 240 196 257 210
             C267 223 268 241 265 266
             C261 300 249 328 234 360
             C214 403 196 457 188 511
             C185 529 190 540 204 547
             C255 566 345 566 396 547
             C410 540 415 529 412 511
             C404 457 386 403 366 360
             C351 328 339 300 335 266
             C332 241 333 223 343 210
             C360 196 376 169 377 130
             C378 84 346 50 300 50 Z" fill="url(#roundLight)"/>

    <!-- Nedideli plastiko atspindžiai -->
    <ellipse cx="278" cy="91" rx="22" ry="13" fill="#ffffff" opacity="0.24" transform="rotate(-18 278 91)"/>
    <path d="M273 245 C254 315 228 407 224 493" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="14" stroke-linecap="round"/>
    <path d="M198 532 C240 551 360 551 402 532" fill="none" stroke="#fff982" stroke-opacity="0.2" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
</svg>
